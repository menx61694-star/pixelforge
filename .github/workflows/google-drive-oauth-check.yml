name: PixelForge Admin and Edge Function Checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-2-users-roles
      - main
    paths:
      - "supabase/functions/google-drive-oauth/**"
      - "supabase/functions/google-drive-files/**"
      - "supabase/functions/user-management/**"
      - "supabase/config.toml"
      - "supabase/phase-2-users-roles.sql"
      - "admin.js"
      - "admin.html"
      - "admin.css"
      - ".github/workflows/google-drive-oauth-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/google-drive-oauth/**"
      - "supabase/functions/google-drive-files/**"
      - "supabase/functions/user-management/**"
      - "supabase/config.toml"
      - "supabase/phase-2-users-roles.sql"
      - "admin.js"
      - "admin.html"
      - "admin.css"
      - ".github/workflows/google-drive-oauth-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check Admin JavaScript and Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check admin JavaScript syntax
        run: node --check admin.js

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/google-drive-oauth/index.ts
          deno check supabase/functions/google-drive-files/index.ts
          deno check supabase/functions/user-management/index.ts
