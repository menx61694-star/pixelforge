<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d49"><title>Student sign in · PixelForge</title><link rel="stylesheet" href="student.css"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js" defer></script><script src="student-auth.js" defer></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onStudentTurnstileReady&render=explicit" defer></script></head><body><main class="student-shell"><a class="student-brand" href="index.html"><span class="student-brand-mark">P</span> PIXELFORGE</a><section class="student-card"><p class="student-eyebrow">STUDENT PORTAL</p><h1>Welcome back.</h1><p class="student-copy">Sign in to continue to your personal dashboard.</p><form id="student-login-form" class="student-form"><label for="student-email">Email address</label><input id="student-email" type="email" autocomplete="username" required><label class="student-honeypot" aria-hidden="true">Leave this field empty<input id="student-website" name="website" type="text" tabindex="-1" autocomplete="off"></label><div id="student-turnstile" aria-label="Anti-bot verification"></div><label for="student-password">Password</label><input id="student-password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="student-status" class="student-status" role="status" aria-live="polite"></p><div class="student-links"><a href="signup.html">New here? Create account</a><a href="index.html">Back to website</a></div></section></main></body></html>
