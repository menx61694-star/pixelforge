<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d49"><title>Create student account · PixelForge</title><link rel="stylesheet" href="student.css"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js" defer></script><script src="student-auth.js" defer></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onStudentTurnstileReady&render=explicit" defer></script></head><body><main class="student-shell"><a class="student-brand" href="index.html"><span class="student-brand-mark">P</span> PIXELFORGE</a><section class="student-card"><p class="student-eyebrow">JOIN PIXELFORGE</p><h1>Create your account.</h1><p class="student-copy">Register to access your personal student dashboard.</p><form id="student-signup-form" class="student-form"><label for="student-name">Full name</label><input id="student-name" type="text" minlength="2" maxlength="120" autocomplete="name" required><label for="student-email">Email address</label><input id="student-email" type="email" autocomplete="email" required><label class="student-honeypot" aria-hidden="true">Leave this field empty<input id="student-website" name="website" type="text" tabindex="-1" autocomplete="off"></label><div id="student-turnstile" aria-label="Anti-bot verification"></div><label for="student-password">Password</label><input id="student-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Create student account</button></form><p id="student-status" class="student-status" role="status" aria-live="polite"></p><div class="student-links"><a href="login.html">Already registered? Sign in</a><a href="index.html">Back to website</a></div></section></main></body></html>
